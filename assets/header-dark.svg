<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="t">
  <title id="t">Musa Agdag. Full-stack developer building products end to end.</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9198a1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m">
      <rect x="560" y="0" width="320" height="190" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect x="560" y="0" width="320" height="190" fill="url(#dots)" mask="url(#m)" opacity="0.35"/>
  <rect x="2" y="40" width="36" height="3" rx="1.5" fill="#a78bfa"/>
  <text x="0" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.5" fill="#f0f6fc">Musa Agdag</text>
  <text x="1" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9198a1">Full-stack developer <tspan fill="#a78bfa">/</tspan> Rust, TypeScript, Python <tspan fill="#a78bfa">/</tspan> Products, bots and real-time apps</text>
  <rect x="0" y="176" width="880" height="1" fill="#3d444d"/>
</svg>
